<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Crear Usuarios - Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Crear Usuarios en Firebase Authentication</h1>
    <button onclick="crearUsuarios()">Crear Todos los Usuarios</button>
    <div id="resultado"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGc2-DXXf9tIaodODA1ORw93QiUGqoEhM",
            authDomain: "school-observation-system.firebaseapp.com",
            projectId: "school-observation-system",
            storageBucket: "school-observation-system.firebasestorage.app",
            messagingSenderId: "328709547954",
            appId: "1:328709547954:web:c99a6cf500a7086e2126ab",
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const usuarios = [
            { email: "admin@school.com", password: "Admin123!", name: "Admin Principal", role: "admin" },
            { email: "maria@school.com", password: "Maria123!", name: "Teacher Maria", role: "homeroom", assigned_group: "1st Grade A", assigned_classes: ["Kindergarten", "1st Grade A"] },
            { email: "juan@school.com", password: "Juan123!", name: "Teacher Juan", role: "homeroom", assigned_group: "2nd Grade", assigned_classes: ["2nd Grade"] },
            { email: "teresa@school.com", password: "Teresa123!", name: "Teacher Teresa", role: "homeroom", assigned_group: "1st Grade B", assigned_classes: ["1st Grade B"] },
            { email: "tina@school.com", password: "Tina123!", name: "Teacher Tina", role: "homeroom", assigned_group: "Kindergarten", assigned_classes: ["Kindergarten", "1st Grade A"] },
            { email: "alex@school.com", password: "Alex123!", name: "Teacher Alex", role: "teacher", assigned_group: "2nd Grade", assigned_subject: "Math", assigned_classes: ["2nd Grade"] }
        ];

        async function crearUsuarios() {
            const resultado = document.getElementById("resultado");
            resultado.innerHTML = "<p>Creando usuarios...</p>";
            
            for (const user of usuarios) {
                try {
                    // Crear en Authentication
                    await auth.createUserWithEmailAndPassword(user.email, user.password);
                    
                    // Crear perfil en Firestore
                    await db.collection("users").add({
                        name: user.name,
                        email: user.email,
                        role: user.role,
                        assigned_group: user.assigned_group || "Sin asignar",
                        assigned_classes: user.assigned_classes || [],
                        assigned_subject: user.assigned_subject || ""
                    });
                    
                    resultado.innerHTML += `<p>✅ ${user.email} creado exitosamente</p>`;
                } catch (error) {
                    resultado.innerHTML += `<p>❌ Error con ${user.email}: ${error.message}</p>`;
                }
            }
            
            resultado.innerHTML += "<p><strong>¡Proceso completado!</strong></p>";
        }
    </script>
</body>
</html>
