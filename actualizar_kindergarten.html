        // Datos completos del CSV
        const estudiantesData = {

        };

        function log(msg, isError = false) {
            const logDiv = document.getElementById("log");
            const span = document.createElement("div");
            span.textContent = msg;
            if (isError) span.className = "error";
            logDiv.appendChild(span);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function procesarYActualizar() {
            const files = document.getElementById("photoInput").files;
            if (files.length === 0) {
                log("⚠️ Por favor selecciona al menos una foto.", true);
                return;
            }

            document.getElementById("btnUpdate").disabled = true;
            log("🔄 Iniciando proceso de actualización...");

            // Mapear archivos por ID extraído del nombre (ej: gradoK108-2026.jpg -> GAP-108)
            const fotosMap = {};
            for (let file of files) {
                const match = file.name.match(/gradoK(\d+)-2026/i);
                if (match) {
                    const studentId = `GAP-${match[1]}`;
                    fotosMap[studentId] = file;
                }
            }

            let completados = 0;
            const total = Object.keys(estudiantesData).length;

            for (const [studentId, data] of Object.entries(estudiantesData)) {
                try {
                    log(`⏳ Procesando ${studentId} (${data.full_name})...`);
                    
                    let photoBase64 = "";
                    if (fotosMap[studentId]) {
                        photoBase64 = await convertirABase64(fotosMap[studentId]);
                        log(`  ✅ Foto cargada para ${studentId} (${(photoBase64.length / 1024).toFixed(1)} KB)`);
                    } else {
                        log(`  ⚠️ No se encontró foto para ${studentId}, se mantendrá la anterior o vacía.`, true);
                    }

                    // Construir payload con la estructura exacta de la app
                    const payload = {
                        basic_info: {
                            name: data.full_name,
                            grade: data.grade,
                            date_of_birth: data.date_of_birth,
                            age: data.age,
                            starting_year: data.starting_year,
                            photo: photoBase64 // Se actualiza o se deja vacío si no hay foto
                        },
                        inclusion_and_support: {
                            inclusion: data.inclusion,
                            diagnostic: data.diagnostic,
                            therapeutic_process: data.therapy
                        },
                        governance: {
                            homeroom_teacher_id: data.homeroom_teacher_id
                        },
                        family_and_contact: {
                            father_name: data.father_name,
                            father_contact: data.father_contact,
                            father_occupation: data.father_occupation,
                            father_email: data.father_email,
                            mother_name: data.mother_name,
                            mother_contact: data.mother_contact,
                            mother_occupation: data.mother_occupation,
                            mother_email: data.mother_email,
                            siblings: data.siblings
                        },
                        medical_record: {
                            illnesses: data.illness,
                            allergies: data.allergies,
                            medicine: data.medicine,
                            prescription: data.prescription
                        },
                        academic_metrics: {
                            academic_performance: data.performance,
                            perf: data.perf
                        }
                    };

                    // Actualizar usando merge: true para no borrar subcolecciones (observaciones, conferencias)
                    await db.collection("students").doc(studentId).set(payload, { merge: true });
                    log(`  ✅✅ ${studentId} actualizado exitosamente en Firestore.`);
                    completados++;

                } catch (error) {
                    log(`  ❌ ERROR en ${studentId}: ${error.message}`, true);
                }
            }

            log(`\n🎉 PROCESO FINALIZADO: ${completados} de ${total} estudiantes actualizados.`);
            document.getElementById("btnUpdate").disabled = false;
        }

        function convertirABase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
